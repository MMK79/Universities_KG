title = "Deep Learning: Foundations and Concepts"
authors = "Christopher M. Bishop, Hugh Bishop"
year = 2024
publisher = "Springer"
isbn13 = "9783031454677"
title_patterns = ['deep\s+learning\W+foundations\s+and\s+concepts']
author_patterns = ['bishop']
url_patterns = ["bishopbook.com"]

