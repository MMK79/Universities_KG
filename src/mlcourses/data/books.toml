# Canonical book catalogue used by the regex matcher.
#
# title_patterns : case-insensitive regexes that identify the title.
# author_patterns: regexes for author surnames. If `generic = true` the title alone is too
#                  common ("Deep Learning", "Machine Learning") and an author (or url) must
#                  appear within the citation window for a match.
# url_patterns   : substrings of the book's canonical/free URL — a link to it is a match.
# isbn13         : the edition listed here; `make verify-isbns` checks it against Open Library.

[[book]]
slug = "bishop-prml"
title = "Pattern Recognition and Machine Learning"
authors = "Christopher M. Bishop"
year = 2006
publisher = "Springer"
isbn13 = "9780387310732"
title_patterns = ['pattern\s+recognition\s+and\s+machine\s+learning', '\bPRML\b']
author_patterns = ['bishop']
url_patterns = ["Bishop-Pattern-Recognition-and-Machine-Learning", "prml-book"]

[[book]]
