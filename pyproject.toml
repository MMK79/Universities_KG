[project]
name = "universities"
version = "0.1.0"
description = "Database of university Machine Learning courses, their textbooks and course materials"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.19.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.8",
]

[project.scripts]
mlcourses = "mlcourses.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlcourses"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["university-domains-list-api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
